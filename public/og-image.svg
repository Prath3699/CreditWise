<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#0c1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glow orb -->
  <ellipse cx="900" cy="200" rx="300" ry="250" fill="#10b981" fill-opacity="0.08"/>

  <!-- Shield icon (simplified) -->
  <g transform="translate(120, 200)">
    <path d="M40 0 L80 15 L80 50 C80 70 60 85 40 90 C20 85 0 70 0 50 L0 15 Z"
          fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M25 45 L35 55 L57 33" fill="none" stroke="url(#accent)" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CredWise wordmark -->
  <text x="225" y="260" font-family="system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="700" fill="white" letter-spacing="-1">Cred</text>
  <text x="411" y="260" font-family="system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="700" fill="url(#accent)" letter-spacing="-1">Wise</text>

  <!-- Tagline -->
  <text x="225" y="310" font-family="system-ui, -apple-system, sans-serif"
        font-size="26" fill="#94a3b8" letter-spacing="0.5">
    Free Credit Score Estimator &amp; Simulator
  </text>

  <!-- Score bar decoration -->
  <rect x="225" y="355" width="600" height="8" rx="4" fill="#1e293b"/>
  <rect x="225" y="355" width="420" height="8" rx="4" fill="url(#accent)"/>

  <!-- Score range labels -->
  <text x="225" y="385" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">300</text>
  <text x="800" y="385" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">850</text>

  <!-- Feature pills -->
  <rect x="225" y="420" width="160" height="40" rx="20" fill="#10b98120"/>
  <text x="305" y="446" font-family="system-ui, sans-serif" font-size="16" fill="#10b981"
        text-anchor="middle">✓ Instant Estimate</text>

  <rect x="400" y="420" width="160" height="40" rx="20" fill="#10b98120"/>
  <text x="480" y="446" font-family="system-ui, sans-serif" font-size="16" fill="#10b981"
        text-anchor="middle">✓ What-If Sim</text>

  <rect x="575" y="420" width="160" height="40" rx="20" fill="#10b98120"/>
  <text x="655" y="446" font-family="system-ui, sans-serif" font-size="16" fill="#10b981"
        text-anchor="middle">✓ 100% Free</text>

  <!-- URL -->
  <text x="225" y="530" font-family="system-ui, sans-serif" font-size="20" fill="#475569">
    credwise.example.com
  </text>
</svg>
